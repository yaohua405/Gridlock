version: '3.9'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: gridlock-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gridlock
      POSTGRES_USER: gridlock
      POSTGRES_PASSWORD: gridlock
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gridlock-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ./server
    container_name: gridlock-api
    restart: unless-stopped
    env_file:
      - ./server/.env.example
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
